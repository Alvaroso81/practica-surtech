<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SurTech · Práctica global UD2</title>
<style>
:root{--bg:#0b1220;--panel:#121a2b;--panel2:#18233a;--line:#26324a;--txt:#e6ebf5;--mut:#93a0b8;--acc:#38bdf8;--acc2:#0ea5e9;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;--ps:#012456}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc)}
code,pre,.mono{font-family:Consolas,"Cascadia Mono",Menlo,monospace}
code{background:#0f2036;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:.92em}
pre{background:#07101d;border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto;white-space:pre-wrap;word-break:break-word}
h1,h2,h3{line-height:1.2;margin:.2em 0 .5em}
button{font:inherit;cursor:pointer}
.btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 14px}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc2);border-color:var(--acc2);color:#00131f;font-weight:600}
.btn.primary:hover{filter:brightness(1.1)}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,textarea,select{font:inherit;color:inherit}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin:0 auto 18px;max-width:980px}
.muted{color:var(--mut)}
.small{font-size:13px}
.note{background:#2a1d06;border:1px solid #6b4a0c;border-radius:8px;padding:8px 12px}
.tip{background:#062433;border:1px solid #0c4a6e;border-radius:8px;padding:8px 12px}
.field{display:block;margin:10px 0}
.field input,.field textarea{width:100%;background:#0a1322;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-top:4px}
textarea.paste{width:100%;min-height:200px;background:#07101d;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:Consolas,Menlo,monospace;font-size:13px}
/* header */
#hdr{position:sticky;top:0;z-index:20;background:#0a1120ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;padding:8px 16px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.3px}
.brand span{color:var(--acc)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{border:1px solid var(--line);background:var(--panel);color:var(--mut);border-radius:999px;padding:3px 12px;font-size:13px}
.step.on{border-color:var(--acc);color:var(--txt);background:#0c2a40}
.step.done{color:var(--ok)}
.step:disabled{opacity:.45}
.pill{margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px}
main{padding:18px 16px 40px}
/* checks */
.checks{list-style:none;padding:0;margin:10px 0}
.checks li{padding:6px 10px;border-radius:8px;margin:4px 0;background:var(--panel2);display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.checks li .ic{width:20px;flex:none;text-align:center}
.checks li.ok .ic{color:var(--ok)}
.checks li.ko .ic{color:var(--bad)}
.checks li .fix{flex-basis:100%;margin-left:28px;font-size:13px;color:var(--mut)}
.copyrow{display:flex;gap:8px;align-items:stretch}
.copyrow pre{flex:1;margin:0}
/* phase 2 */
.ph2{display:grid;grid-template-columns:220px minmax(330px,1fr) minmax(480px,1.35fr);gap:12px;align-items:start}
@media (max-width:1150px){.ph2{grid-template-columns:1fr}}
.inbox,.ticket,.server{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.inbox{padding:10px;position:sticky;top:64px}
.inbox h3{font-size:14px;color:var(--mut);margin:4px 4px 8px;text-transform:uppercase;letter-spacing:.6px}
.tk{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;color:var(--txt);padding:7px 8px;margin-bottom:4px}
.tk:hover{background:var(--panel2)}
.tk.sel{border-color:var(--acc);background:#0c2a40}
.tk .s{font-size:12px;color:var(--mut);display:block}
.tk.urg{border-color:var(--bad);background:#3a0d0d}
.locked{color:var(--mut);font-size:13px;padding:6px 8px}
.ticket{padding:16px;min-height:300px}
.tk-head{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:#1e3a5f;flex:none}
.av.urg{background:var(--bad)}
.q{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}
.q .qt{font-weight:600;margin-bottom:6px}
.q label.opt{display:flex;gap:8px;align-items:flex-start;padding:4px 2px;cursor:pointer}
.q input[type=number]{width:110px;background:#0a1322;border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.q select{background:#0a1322;border:1px solid var(--line);border-radius:6px;padding:5px;max-width:100%}
.q .multi{display:flex;flex-wrap:wrap;gap:6px}
.q .multi label{background:#0a1322;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer}
.q .item{margin:8px 0;padding-top:6px;border-top:1px dashed var(--line)}
.res-ok{color:var(--ok)}.res-ko{color:var(--bad)}
.fb{margin:10px 0}
.fb.warn{background:#3a0d0d;border:1px solid #7f1d1d;border-radius:8px;padding:8px 12px}
.learn{background:#0b2e1e;border:1px solid #166534;border-radius:8px;padding:10px 12px;margin-top:10px}
.tbl{width:100%;border-collapse:collapse;margin:8px 0}
.tbl td,.tbl th{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.tbl th{background:var(--panel2)}
.server{overflow:hidden;position:sticky;top:64px}
.tabs{display:flex;gap:2px;background:#0a1120;padding:6px 6px 0;flex-wrap:wrap}
.tabs button{background:#1a2438;color:var(--mut);border:0;border-radius:8px 8px 0 0;padding:7px 12px;font-size:13px}
.tabs button.on{background:var(--ps);color:#fff}
.tabs button.on.mm{background:#f0f0f0;color:#000}
.tabs .run{margin-left:auto;background:#24324d;color:#fff;border-radius:8px;margin-bottom:6px}
.pane{display:none;height:calc(100vh - 140px);min-height:460px}
.pane.on{display:block}
/* PowerShell */
.ps{background:var(--ps);color:#eeedf0;height:100%;overflow:auto;padding:10px 12px;font:13.5px/1.35 Consolas,"Cascadia Mono",Menlo,monospace;cursor:text}
#ps-out{white-space:pre-wrap;word-break:break-word;margin:0}
.ps-line{display:flex;white-space:pre}
.ps-line input{flex:1;background:transparent;border:0;outline:0;color:#fff;font:inherit;padding:0;min-width:40px}
/* MMC (lusrmgr) */
.mmc{background:#fff;color:#000;height:100%;display:flex;flex-direction:column;font:13px "Segoe UI",system-ui,sans-serif}
.mmc-title{background:#fff;border-bottom:1px solid #ddd;padding:6px 10px;font-size:12px}
.mmc-menu{background:#f5f5f5;border-bottom:1px solid #ddd;padding:3px 10px;font-size:12px;color:#333;word-spacing:12px}
.mmc-body{flex:1;display:grid;grid-template-columns:170px 1fr 150px;min-height:0}
.mmc-tree{border-right:1px solid #ddd;padding:6px;overflow:auto}
.mmc-tree div{padding:2px 4px;cursor:pointer;border-radius:2px;white-space:nowrap}
.mmc-tree div.sel{background:#cce8ff}
.mmc-tree .ind{padding-left:18px}
.mmc-list{overflow:auto}
.mmc-list table{border-collapse:collapse;width:100%}
.mmc-list th{font-weight:400;text-align:left;border-bottom:1px solid #ddd;border-right:1px solid #eee;padding:3px 6px;position:sticky;top:0;background:#fff}
.mmc-list td{padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;cursor:default}
.mmc-list tr.sel td{background:#cce8ff}
.mmc-list tr:hover td{background:#e5f3ff}
.uic{position:relative;display:inline-block;width:18px}
.uic .dn{position:absolute;left:8px;top:6px;font-size:9px;background:#fff;border:1px solid #444;border-radius:50%;width:11px;height:11px;line-height:9px;text-align:center;color:#000}
.mmc-act{border-left:1px solid #ddd;background:#fafafa;overflow:auto}
.mmc-act .h{background:#e8eef7;font-weight:600;padding:3px 8px;border-bottom:1px solid #ddd}
.mmc-act button{display:block;width:100%;text-align:left;background:none;border:0;padding:3px 8px 3px 16px;font-size:12.5px;color:#000}
.mmc-act button:hover{background:#e5f3ff}
@media (max-width:700px){.mmc-body{grid-template-columns:1fr}.mmc-tree{display:flex;gap:6px}.mmc-tree .ind{padding-left:4px}}
/* Windows dialogs */
.ov{position:fixed;inset:0;background:#0006;display:grid;place-items:center;z-index:100;padding:10px}
.dlg{background:#f0f0f0;color:#000;border:1px solid #888;box-shadow:0 10px 40px #0008;font:13px "Segoe UI",system-ui,sans-serif;max-height:94vh;display:flex;flex-direction:column}
.dlg-t{background:#fff;display:flex;justify-content:space-between;align-items:center;padding:6px 6px 6px 10px}
.dlg-x{background:none;border:0;font-size:14px;width:30px;height:24px}
.dlg-x:hover{background:#e81123;color:#fff}
.dlg-b{padding:12px 14px;overflow:auto}
.dlg-f{display:flex;justify-content:flex-end;gap:6px;padding:8px 12px 12px}
.wbtn{background:#e1e1e1;border:1px solid #adadad;padding:3px 14px;min-width:80px;color:#000}
.wbtn:hover{background:#e5f1fb;border-color:#0078d7}
.wbtn.primary{border:2px solid #0078d7}
.dlg label.w{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:6px;margin:6px 0}
.dlg input[type=text],.dlg input[type=password],.dlg textarea{border:1px solid #7a7a7a;background:#fff;padding:3px 5px;color:#000;width:100%}
.dlg label.chk{display:flex;gap:6px;align-items:flex-start;margin:5px 0}
.dlg label.chk.dis{color:#888}
.wtabs{display:flex;gap:0;border-bottom:1px solid #adadad;margin-bottom:8px}
.wtabs button{background:#f0f0f0;border:1px solid #adadad;border-bottom:0;padding:3px 10px;margin-right:-1px;color:#000}
.wtabs button.on{background:#fff;position:relative;top:1px}
.wtabs button:disabled{color:#999}
.wtab{display:none;background:#fff;border:1px solid #adadad;border-top:0;padding:10px;margin-top:-8px}
.wtab.on{display:block}
.wlist{width:100%;border:1px solid #7a7a7a;background:#fff;color:#000;min-height:130px}
.msg{white-space:pre-wrap;max-width:460px;margin:4px 0}
.row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.secpol td{border-bottom:1px solid #eee;padding:3px 8px}
#toast{position:fixed;right:16px;bottom:16px;background:#7f1d1d;border:1px solid var(--bad);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:200;box-shadow:0 6px 24px #0008}
footer{text-align:center;color:var(--mut);font-size:12px;padding:10px}
footer button{background:none;border:0;color:var(--mut);text-decoration:underline}
.grade{font-size:42px;font-weight:800;color:var(--acc)}
@media print{.checks li,.q,.note,.learn,.fb,.tip{background:#f4f4f4!important;color:#000!important;border-color:#bbb!important}#hdr,footer,.noprint{display:none!important}body{background:#fff;color:#000}.card{border:1px solid #999;background:#fff;color:#000;max-width:none}pre,code{background:#f4f4f4;color:#000}.tbl th{background:#eee}.muted{color:#444}}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="main"></main>
<footer class="noprint">SurTech S.L. · Práctica global UD2 – Usuarios, grupos y perfiles · SOR 2.º SMR · <button data-act="reset">Reiniciar práctica</button></footer>
<div id="toast"></div>
<script>
'use strict';
/* ================= utilidades ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const skel=s=>norm(s).replace(/[^a-z0-9]/g,'');
// tolera tildes rotas al copiar desde CMD (p. ej. "Mar¡a")
const looseEq=(a,b)=>{const x=skel(a),y=skel(b);if(!y)return false;return x===y||(x.replace(/[aeiou]/g,'')===y.replace(/[aeiou]/g,'')&&Math.abs(x.length-y.length)<=3);};
const cmp=(a,b)=>a.localeCompare(b,'es',{sensitivity:'base'});
function fnv(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h;}
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function perm(n,seedStr){const r=rng(fnv(seedStr));const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const p2=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()}`;};
const now=()=>{const d=new Date();return `${today()} ${d.getHours()}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;};
const hhmm=()=>{const d=new Date();return `${p2(d.getHours())}:${p2(d.getMinutes())}`;};
function addDays(s,n){const [dp,tp]=s.split(' ');const [d,m,y]=dp.split('/').map(Number);const x=new Date(y,m-1,d+n);return `${p2(x.getDate())}/${p2(x.getMonth()+1)}/${x.getFullYear()}${tp?' '+tp:''}`;}
function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',4500);}

/* ================= estado ================= */
// progreso guardado por alumno: varios alumnos pueden compartir el mismo equipo/navegador
const KEY='surtech-ud2-v1', CUR='surtech-ud2-actual', RKEY='surtech-ud2-resets';
const pkey=seed=>KEY+':'+seed;
let P=null;
const S=()=>P.server;
function loadSeed(seed){try{const j=localStorage.getItem(pkey(seed));return j?JSON.parse(j):null;}catch(e){return null;}}
function load(){try{const c=localStorage.getItem(CUR);P=c?loadSeed(c):null;}catch(e){P=null;}}
function save(){try{localStorage.setItem(pkey(P.seed),JSON.stringify(P));localStorage.setItem(CUR,P.seed);}catch(e){}}
const resets=()=>Number(localGet(RKEY+':'+(P?.seed||''))||0);
function logEv(s){P.log.push(`[${hhmm()}] ${s}`);if(P.log.length>600)P.log.shift();}

const NOMBRES=['Lucía','Javier','Irene','Sergio','Nerea','Adrián','Paula','Hugo','Carla','Iker','Marta','Raúl','Sara','Diego','Elena','Óscar'];
const APELLIDOS=['Fernández','Navarro','Domínguez','Ortega','Castillo','Romero','Herrera','Molina','Delgado','Suárez','Iglesias','Peña','Cortés','Benítez','Vázquez','Serrano'];
function makeHire(seed){const h=fnv(seed+'#hire');const first=NOMBRES[h%16],a1=APELLIDOS[(h>>>4)%16];let a2=APELLIDOS[(h>>>8)%16];if(a2===a1)a2=APELLIDOS[((h>>>8)+5)%16];
  return {first,a1,full:`${first} ${a1} ${a2}`,user:(norm(first)[0]+norm(a1)).replace(/[^a-z]/g,'')};}

const DOM='S-1-5-21-2148331079-3982102364-1150287519-';
function initialServer(){
  const SV={users:{},groups:{},next:1010};
  const u=(rid,name,full,comment,o={})=>{const sid=DOM+rid;SV.users[sid]=Object.assign({sid,name,full,comment,active:true,mustChange:false,cannotChange:false,neverExpires:false,builtin:false,pwd:'x',pwdSet:'03/11/2026 9:14:02',resets:0},o);return sid;};
  const g=(sid,name,comment,members,builtin=false)=>{SV.groups[sid]={sid,name,comment,members,builtin};};
  const adm=u(500,'Administrador','','Cuenta integrada para la administración del equipo o dominio',{builtin:true,pwdSet:'01/10/2026 18:02:11',lastLogon:today()+' 8:01:13'});
  const inv=u(501,'Invitado','','Cuenta integrada para el acceso como invitado al equipo o dominio',{builtin:true,active:false});
  u(503,'DefaultAccount','','Cuenta de usuario administrada por el sistema.',{builtin:true,active:false});
  u(504,'WDAGUtilityAccount','','Cuenta de usuario que el sistema administra y usa para escenarios de Protección de aplicaciones de Windows Defender.',{builtin:true,active:false});
  const mg=u(1000,'mgarcia','María García','Contabilidad',{mustChange:true});
  const pl=u(1001,'plopez','Pedro López','Ventas',{neverExpires:true});
  const ar=u(1002,'aruiz','Ana Ruiz','Contabilidad',{active:false});
  const rm=u(1003,'rmoreno','Ramón Moreno','Técnico informático',{pwdSet:'02/09/2026 10:40:55',lastLogon:'17/10/2026 19:22:40'});
  const co=u(1004,'comercial','Comercial','Cuenta compartida por todo Ventas. Contraseña en pósit del monitor',{neverExpires:true});
  const pr=u(1005,'prueba01','Prueba','Cuenta de pruebas de Ramón - borrar');
  g('S-1-5-32-544','Administradores','Los administradores tienen acceso completo y sin restricciones al equipo o dominio',[adm,rm,pl],true);
  g('S-1-5-32-545','Usuarios','Los usuarios no pueden hacer cambios accidentales o intencionados en el sistema y pueden ejecutar la mayoría de aplicaciones',[mg,pl,ar,rm,co,pr],true);
  g('S-1-5-32-546','Invitados','Los invitados tienen, de manera predeterminada, el mismo acceso que los miembros del grupo Usuarios',[inv],true);
  g('S-1-5-32-551','Operadores de copia de seguridad','Pueden invalidar restricciones de seguridad con el único propósito de hacer copias de seguridad o restaurar archivos',[],true);
  g('S-1-5-32-555','Usuarios de escritorio remoto','A los miembros de este grupo se les concede el derecho de iniciar sesión remotamente',[],true);
  g(DOM+1006,'Ventas','Trabajadores de Ventas',[pl,co]);
  g(DOM+1007,'Contabilidad','Trabajadores de Contabilidad',[mg,ar]);
  g(DOM+1008,'Administracion','Trabajadores de Administración',[]);
  g(DOM+1009,'GrupoPrueba','Grupo de pruebas de Ramón - borrar',[pr]);
  return SV;
}
function newProgress(st){
  const seed=norm(st.nombre+' '+st.apellidos);
  const hire=makeHire(seed);
  return {v:1,student:st,seed,hire,screen:1,maxPhase:1,lab1:null,real:null,tickets:{},urgent:[],penalties:[],log:[],
    server:initialServer(),employeeNames:['mgarcia','plopez','aruiz',hire.user],
    orig:{rmoreno:DOM+1003,comercial:DOM+1004},view:null,termBuf:'',started:now()};
}

/* ================= modelo del servidor ================= */
const strip=n=>String(n??'').replace(/^.*\\/,'').trim();
const userBy=n=>Object.values(S().users).find(x=>x.name.toLowerCase()===strip(n).toLowerCase());
const groupBy=n=>Object.values(S().groups).find(x=>x.name.toLowerCase()===strip(n).toLowerCase());
const inGroup=(gn,un)=>{const g=groupBy(gn),u=userBy(un);return !!(g&&u&&g.members.includes(u.sid));};
const groupsOf=sid=>Object.values(S().groups).filter(g=>g.members.includes(sid)).sort((a,b)=>cmp(a.name,b.name));
const membersNames=gn=>{const g=groupBy(gn);return g?g.members.map(s=>S().users[s]?.name).filter(Boolean):[];};
const allUserNames=()=>Object.values(S().users).map(u=>u.name).sort(cmp);

const E={
  ok:'Se ha completado el comando correctamente.',
  noUser:'No se encuentra el nombre de usuario.\n\nPuede obtener más ayuda con NET HELPMSG 2221.',
  userExists:'La cuenta ya existe.\n\nPuede obtener más ayuda con NET HELPMSG 2224.',
  pwd:'La contraseña no cumple los requisitos de la directiva de contraseñas. Compruebe los requisitos de longitud mínima, complejidad e historial de contraseñas.\n\nPuede obtener más ayuda con NET HELPMSG 2245.',
  noGroup:'Error de sistema 1376.\n\nEl grupo local especificado no existe.',
  groupExists:'Error de sistema 1379.\n\nEl grupo local especificado ya existe.',
  already:'Error de sistema 1378.\n\nEl nombre de cuenta especificado ya es miembro del grupo.',
  notMember:'Error de sistema 1377.\n\nEl miembro especificado no pertenece al grupo local.',
  noMap:'Error de sistema 1332.\n\nNo se ha efectuado ninguna asignación entre los nombres de cuenta y los identificadores de seguridad.',
  builtin:'No se puede realizar esta operación en cuentas o grupos integrados del sistema.',
  badName:'El nombre de usuario o de grupo no es válido.',
  mismatch:'Las contraseñas no coinciden.',
};
const cleanErr=e=>e.replace(/\n\nPuede obtener más ayuda.*$/s,'').replace(/^Error de sistema \d+\.\n\n/,'');
const BAD_NAME=/["\/\\\[\]:;|=,+*?<>@]/;
function pwdOk(pwd,u){
  if(!pwd||pwd.length<7)return false;
  let c=0;if(/[A-Z]/.test(pwd))c++;if(/[a-z]/.test(pwd))c++;if(/[0-9]/.test(pwd))c++;if(/[^A-Za-z0-9]/.test(pwd))c++;
  if(c<3)return false;
  const low=pwd.toLowerCase();
  if(u.name.length>=3&&low.includes(u.name.toLowerCase()))return false;

function applyUserSwitches(u,sw){

const USER_SW=['/add','/delete','/del','/active','/fullname','/comment','/passwordchg','/logonpasswordchg'];
function netUser(a){

  if(!pos.length)return Object.keys(sw).length?SYN_USER:listUsers();
  const name=pos[0];

    if(pos.length>2)return SYN_USER;
    const o={full:sw['/fullname']===true?'':sw['/fullname'],comment:sw['/comment']===true?'':sw['/comment'],disabled:yn(sw['/active'])===false,cannotChange:yn(sw['/passwordchg'])===false,mustChange:yn(sw['/logonpasswordchg'])===true};

    const err=opCreateUser(name,pos[1]||'',o);if(err)return err;afterChange();return E.ok;

function netLocalgroup(a){

function termEnter(v){

function termInit(){

function dialog(title,html,buttons,width=430){

  const f=ov.querySelector('.dlg-f');const close=()=>ov.remove();
  for(const b of buttons){const btn=document.createElement('button');btn.textContent=b.label;btn.className='wbtn'+(b.primary?' primary':'');
    btn.onclick=()=>{if(!b.onClick||b.onClick(ov)!==false)close();};f.appendChild(btn);}
  ov.querySelector('.dlg-x').onclick=()=>{const c=buttons.find(b=>b.cancel);if(c&&c.onClick)c.onClick(ov);close();};
  ov.addEventListener('keydown',e=>{if(e.key==='Escape')ov.querySelector('.dlg-x').click();else if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();ov.querySelector('.wbtn.primary')?.click();}});
  document.body.appendChild(ov);
  const first=ov.querySelector('input[type=text],input[type=password],textarea')||ov.querySelector('.wbtn.primary');first&&first.focus();
  return ov;
}

function mustWire(d,pre,newUser){
  const must=$(`#${pre}-must`,d),cant=$(`#${pre}-cant`,d),never=$(`#${pre}-never`,d);
  const grey=()=>{if(!newUser)return;for(const c of [cant,never]){c.disabled=must.checked;if(must.checked)c.checked=false;c.parentElement.classList.toggle('dis',must.checked);}};
  must.onchange=()=>{if(!newUser&&must.checked&&never.checked){never.checked=false;msgbox('Ha seleccionado «El usuario debe cambiar la contraseña en el siguiente inicio de sesión». La opción «La contraseña nunca expira» se ha desactivado.');}grey();};
  never.onchange=()=>{if(never.checked&&must.checked){must.checked=false;msgbox('Ha seleccionado «La contraseña nunca expira». El usuario no tendrá que cambiar la contraseña en el siguiente inicio de sesión.');}};

function qHtml(t,q,rec){

function readAnswer(t,q){
  const pre=`${t.id}-${q.id}`,box=$('#ticket');
  if(q.type==='choice'){const r=$(`input[name="${pre}"]:checked`,box);return r?Number(r.value):null;}
  if(q.type==='number'){const v=$(`input[name="${pre}"]`,box).value.trim();return v===''?null:Number(v);}
  if(q.type==='multi')return $$(`input[name="${pre}"]:checked`,box).map(i=>i.value);
  if(q.type==='match'){const v=q.items.map((_,k)=>$(`select[name="${pre}-${k}"]`,box).value);return v.includes('')?null:v.map(Number);}
}
function gradeQ(q,a){
  if(q.type==='choice')return {score:a===q.answer?1:0,exp:q.options[q.answer],given:q.options[a]};
  if(q.type==='number'){const e=q.answer();return {score:a===e?1:0,exp:String(e),given:String(a)};}
  if(q.type==='multi'){const e=q.answer().map(x=>x.toLowerCase()).sort(),g=a.map(x=>x.toLowerCase()).sort();return {score:e.join('|')===g.join('|')?1:0,exp:q.answer().sort(cmp).join(', ')||'(ninguna)',given:a.join(', ')||'(ninguna)'};}
  if(q.type==='match'){const ok=q.items.filter((it,k)=>a[k]===it.a).length;return {score:ok/q.items.length,exp:q.items.map((it,k)=>`${k+1}) ${q.options[it.a]}`).join(' · '),given:`${ok} de ${q.items.length} correctas`};}
}
function solve(){
  const id=P.view||currentId();const t=defById(id),rec=R(id);if(!t||rec.done)return;
  const answers={};
  for(const q of t.qs){const a=readAnswer(t,q);if(a===null){fb('Responde todas las preguntas antes de resolver el ticket.');return;}answers[q.id]=a;}
  const fatal=t.fatal?t.fatal():null;
  const checks=t.checks?t.checks(rec).map(([l,ok])=>[l,!!ok]):[];
  const failed=checks.filter(c=>!c[1]);
  if(!fatal&&failed.length){
    rec.attempts++;logEv(`Ticket ${id}: intento fallido (${failed.map(f=>f[0]).join('; ')})`);save();renderHeader();
    fb(`<b>El ticket todavía no está resuelto</b> (intento fallido nº ${rec.attempts}${t.urgent?'':', −1 punto'}). Revisa en el servidor:<ul class="checks">${failed.map(f=>`<li class="ko"><span class="ic">✗</span>${esc(f[0])}</li>`).join('')}</ul>`);return;}
  const actionMax=t.urgent?0:(t.checks?6:0);
  let pts=actionMax?(fatal?0:Math.max(2,actionMax-rec.attempts)):0;
  const qMax=t.urgent||!t.qs.length?0:(10-actionMax)/t.qs.length;
  rec.qres={};
  for(const q of t.qs){const r=gradeQ(q,answers[q.id]);rec.qres[q.id]=r;pts+=r.score*qMax;}
  Object.assign(rec,{done:true,pts:Math.round(pts*100)/100,fatal,checks,at:now()});
  logEv(`Ticket ${id} resuelto: ${rec.pts} puntos${fatal?' (acción irreversible)':''}`);
  P.view=id;save();renderInbox();renderTicket();renderHeader();
}

function parseNet(text){
  const res={userLists:[],users:{},groups:{}};let cur=null;
  const lines=String(text||'').replace(/\r/g,'').split('\n');
  for(const raw of lines){
    const line=raw.replace(/\s+$/,'');let m;
    if((m=line.match(/^\s*(Cuentas de usuario de|User accounts for)\s+\\\\(\S+)/i))){cur={type:'list',host:m[2],names:[],dash:false};res.userLists.push(cur);continue;}
    if((m=line.match(/^(Nombre de usuario|User name)\s{2,}(\S.*)$/i))){cur={type:'user',name:m[2].trim(),f:{},groups:[],inG:false};res.users[cur.name.toLowerCase()]=cur;continue;}
    if((m=line.match(/^(Nombre de alias|Alias name)\s{2,}(\S.*)$/i))){cur={type:'group',name:m[2].trim(),comment:'',members:[],dash:false};res.groups[skel(cur.name)]=cur;continue;}
    if(!cur)continue;
    if(/(completado el comando|command completed)/i.test(line)||/^(Error de sistema|System error)/i.test(line)){cur=null;continue;}
    if(cur.type==='list'){if(/^-{10,}/.test(line)){cur.dash=true;continue;}if(cur.dash&&line.trim())cur.names.push(...line.trim().split(/\s+/));}
    else if(cur.type==='group'){if(/^-{10,}/.test(line)){cur.dash=true;continue;}
      if(!cur.dash){const c=line.match(/^(Comentario|Comment)\b\s*(.*)$/i);if(c)cur.comment=c[2].trim();}else if(line.trim())cur.members.push(line.trim());}
    else{
      const gl=line.match(/^(Miembros del grupo local|Local Group Memberships)\s*(.*)$/i);
      if(gl){cur.inG=true;cur.groups.push(...gl[2].split('*').map(s=>s.trim()).filter(Boolean));continue;}
      if(/^(Miembros del grupo global|Global Group memberships)/i.test(line)){cur.inG=false;continue;}
      if(cur.inG&&/^\s+\*/.test(raw)){cur.groups.push(...line.split('*').map(s=>s.trim()).filter(Boolean));continue;}
      cur.inG=false;
      const f=line.match(/^(.+?)\s{2,}(.*)$/);if(f)cur.f[norm(f[1])]=f[2].trim();else if(line.trim())cur.f[norm(line.trim())]='';
    }
  }
  return res;
}

  L.push({s:'A',l:'La cuenta está activa',ok:isYes(pf(H,'cuenta activa','account active'))});
  L.push({s:'A',l:'Es miembro de Ventas',ok:rUserIn(H,'Ventas')});
  L.push({s:'A',l:'No es miembro de Administradores',ok:!!H&&!rUserIn(H,'Administradores')});
  const F=rFindGroup(r,'Facturas');
  L.push({s:'B',l:'Existe el grupo Facturas',ok:!!F});
  L.push({s:'B',l:'Facturas tiene descripción',ok:!!F&&!!F.comment});
  L.push({s:'B',l:'plopez es miembro de Facturas',ok:rHas(F,'plopez')});
  L.push({s:'B',l:'aruiz es miembro de Facturas',ok:rHas(F,'aruiz')});
  const Mg=rFindUser(r,'mgarcia'),Cg=rFindGroup(r,'Contabilidad'),Ag=rFindGroup(r,'Administracion');
  L.push({s:'C',l:'mgarcia tiene la descripción de Administración',ok:/administraci/i.test(pf(Mg,'comentario','comment')||'')});
  L.push({s:'C',l:'mgarcia es miembro de Administracion',ok:rUserIn(Mg,'Administracion')&&(!Ag||rHas(Ag,'mgarcia'))});
  L.push({s:'C',l:'mgarcia ya no está en Contabilidad',ok:!!Mg&&!rUserIn(Mg,'Contabilidad')&&!!Cg&&!rHas(Cg,'mgarcia')});
  L.push({s:'C',l:'La cuenta mgarcia está activa',ok:isYes(pf(Mg,'cuenta activa','account active'))});
  const Pd=rFindUser(r,'plopez');
  L.push({s:'D',l:'La cuenta plopez sigue existiendo',ok:!!Pd});
  L.push({s:'D',l:'La cuenta plopez está deshabilitada',ok:!!Pd&&!isYes(pf(Pd,'cuenta activa','account active'))});
  L.push({s:'D',l:'plopez conserva Ventas y Facturas',ok:rUserIn(Pd,'Ventas')&&rUserIn(Pd,'Facturas')});
  return L;
}

function grades(){
  const tk=TICKETS.reduce((a,t)=>a+(P.tickets[t.id]?.pts||0),0);
  const adm=P.server&&G('Administradores');
  const extraAdmins=adm?adm.members.filter(s=>S().users[s]&&S().users[s].name!=='Administrador').map(s=>S().users[s].name):[];
  const audit=(ticketsDone()===TICKETS.length&&extraAdmins.length)?5:0;
  const pen=P.penalties.reduce((a,b)=>a+b.pts,0)+audit;
  const sim=Math.max(0,tk-pen);
  const simN=sim/(TICKETS.length*10)*10;
  const realN=P.real?P.real.ok/P.real.total*10:0;
  return {tk,pen,audit,extraAdmins,sim,simN,realN,final:simN*0.6+realN*0.4};
}

document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act]){if(a.tagName==='BUTTON')e.preventDefault();ACT[a.dataset.act](a,e);}});
document.addEventListener('dblclick',e=>{const tr=e.target.closest('tr[data-sid]');if(tr){gui.sel=tr.dataset.sid;renderMMC();mmcProps();}});
load();render();
</script>
